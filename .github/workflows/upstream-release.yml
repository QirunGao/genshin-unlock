name: Sync upstream and release

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest

    outputs:
      release_exists: ${{ steps.check.outputs.release_exists }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      release_version: ${{ steps.check.outputs.release_version }}

    steps:
      - name: Check upstream version
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cmakeUrl = "https://raw.githubusercontent.com/z3lx/genshin-unlock/main/CMakeLists.txt"
          $cmake = Invoke-RestMethod -Uri $cmakeUrl
          if ($cmake -notmatch "VERSION\s+([0-9]+(?:\.[0-9]+){2,3})") {
            throw "Could not read upstream project version from CMakeLists.txt"
          }

          $projectVersion = $Matches[1]
          $releaseVersion = $projectVersion -replace "\.0$", ""
          $releaseTag = "fork-$releaseVersion"
          $releaseTags = @(
            gh release list `
              --repo $env:GITHUB_REPOSITORY `
              --limit 100 `
              --json tagName `
              --jq ".[].tagName"
          )
          if ($LASTEXITCODE -eq 0) {
            $releaseExists = $releaseTags -contains $releaseTag
          } else {
            throw "Failed to list releases"
          }

          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_exists=$($releaseExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  sync-build-release:
    needs: preflight
    if: needs.preflight.outputs.release_exists != 'true'
    runs-on: windows-2022

    outputs:
      commit: ${{ steps.sync.outputs.commit }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase fork onto upstream
        id: sync
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Invoke-Checked {
            param([scriptblock]$Command)
            & $Command
            if ($LASTEXITCODE -ne 0) {
              throw "Command failed: $Command"
            }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $upstreamUrl = "https://github.com/z3lx/genshin-unlock.git"
          if (git remote get-url upstream 2>$null) {
            git remote set-url upstream $upstreamUrl
          } else {
            git remote add upstream $upstreamUrl
          }

          $beforeRebase = git rev-parse HEAD
          Invoke-Checked { git fetch upstream main --prune }
          Invoke-Checked { git rebase upstream/main }
          $afterRebase = git rev-parse HEAD

          $rebased = $beforeRebase -ne $afterRebase
          if ($rebased) {
            Invoke-Checked { git push --force-with-lease origin HEAD:${{ github.event.repository.default_branch }} }
          } else {
            Write-Host "No upstream changes to push."
          }

          "rebased=$($rebased.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target loader helper plugin

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ needs.preflight.outputs.release_version }}"
          $packageName = "GenshinUnlock-$version"
          $packageDir = "dist\$packageName"
          New-Item -ItemType Directory -Force $packageDir | Out-Null
          Copy-Item build\Release\GenshinUnlockLoader.exe $packageDir\
          Copy-Item build\Release\GenshinUnlockElevatedLauncher.exe $packageDir\
          Copy-Item build\Release\GenshinUnlockPlugin.dll $packageDir\
          Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\$packageName.zip" -Force

          $hashes = @()
          $hashes += Get-FileHash -Algorithm SHA256 "dist\$packageName.zip" |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $packageName.zip" }
          foreach ($file in Get-ChildItem $packageDir) {
            $hashes += Get-FileHash -Algorithm SHA256 $file.FullName |
              ForEach-Object { "$($_.Hash.ToLowerInvariant())  $packageName\$($file.Name)" }
          }
          $hashes | Set-Content -Encoding ascii "dist\$packageName.sha256"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ needs.preflight.outputs.release_tag }}"
          $version = "${{ needs.preflight.outputs.release_version }}"
          $commit = "${{ steps.sync.outputs.commit }}"
          $notes = @"
          Fork build rebased on z3lx/genshin-unlock $version.

          Source commit: $commit
          "@

          $packageName = "GenshinUnlock-$version"
          gh release create $tag "dist\$packageName.zip" "dist\$packageName.sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --target $commit `
            --title "Genshin Unlock $version fork build" `
            --notes $notes
